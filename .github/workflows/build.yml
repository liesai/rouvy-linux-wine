name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 file python3-dbus python3-gi
      - name: Build and check
        run: make check
